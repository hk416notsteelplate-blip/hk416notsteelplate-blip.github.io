status{color:#7f8583;font-size:11px}.status:before{content:"";display:inline-block;width:5px;height:5px;background:#8c607e;border-radius:50%;margin-right:7px}footer{padding:35px 2px 0;display:flex;justify-content:space-between;color:#757d79;font-size:11px;letter-spacing:1px}.footer-email:hover{color:var(--pink)}@media(min-width:1400px){.cover{height:220px}}@media(max-width:850px){.layout{grid-template-columns:140px minmax(0,1fr);padding:30px 24px;gap:24px}.sidebar{top:30px}.intro{padding:32px;min-height:245px}.grid{gap:16px}.card{padding:16px}.cover{height:150px}.cover .number{font-size:65px}.nav a{padding:12px}.nav-caption{margin-left:12px}}@media(max-width:620px){.layout{display:block;padding:18px 18px 30px}.sidebar{position:static;margin-bottom:20px}.nav{display:flex;gap:6px;overflow:auto}.nav a{flex:1;justify-content:center;gap:5px;padding:10px 8px;font-size:13px;white-space:nowrap}.nav-icon{font-size:15px;width:auto}.nav-caption,.sidebar-contact{display:none}.intro{padding:30px 26px;min-height:240px;border-radius:19px}.intro:after{right:-125px}.intro h1{font-size:45px}.section-heading{margin-top:27px}.section-heading span{font-size:9px}.grid{gap:14px}.card{padding:12px;border-radius:16px}.cover{height:135px;border-radius:10px}.cover .number{font-size:56px}.cover .label{font-size:7px;left:11px;letter-spacing:1.5px}.card h3{font-size:19px;margin-top:13px}.card p{font-size:11px;margin-bottom:16px}.tag{font-size:10px;padding:3px 9px}.status{font-size:9px}.card-bottom{gap:6px}footer{font-size:10px}}@media(max-width:360px){.grid{grid-template-columns:1fr}.cover{height:190px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

document.getElementById('year').textContent = new Date().getFullYear();
const links = [...document.querySelectorAll('.nav a')];
function activate(hash) { links.forEach(link => { const active = link.hash === hash; link.classList.toggle('active', active); if (active) link.setAttribute('aria-current', 'location'); else link.removeAttribute('aria-current'); }); }
